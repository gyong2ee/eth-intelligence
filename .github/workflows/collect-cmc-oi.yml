name: Collect CMC ETH open interest
on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: cmc-oi-history
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Collect current CMC OI snapshot
        env:
          CMC_ENDPOINT: https://eth-intelligence.vercel.app/api/cmc
        run: |
          python3 - <<'PY'
          import json, os, pathlib, urllib.request, datetime
          req=urllib.request.Request(os.environ['CMC_ENDPOINT'],headers={'Accept':'application/json','User-Agent':'ETH-Intelligence-OI-Collector/1.0'})
          with urllib.request.urlopen(req,timeout=45) as resp:
              payload=json.load(resp)
          if payload.get('source')!='CoinMarketCap':
              raise ValueError('CMC source mismatch')
          value=float(payload['data']['openInterestUSD'])
          if not 0 < value < 1e15:
              raise ValueError('Invalid OI value')
          path=pathlib.Path('data/cmc-oi-history.json')
          path.parent.mkdir(parents=True,exist_ok=True)
          history=json.loads(path.read_text()) if path.exists() else []
          now=datetime.datetime.now(datetime.timezone.utc).isoformat(timespec='seconds')
          history.append({'collectedAt':now,'openInterestUSD':value,'source':'CoinMarketCap','marketCount':payload['data'].get('marketCount')})
          path.write_text(json.dumps(history,ensure_ascii=False,separators=(',',':'))+'\n')
          print('Recorded',now,value)
          PY
      - name: Commit new observation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/cmc-oi-history.json
          if ! git diff --cached --quiet; then
            git commit -m "data: record CMC ETH OI hourly"
            git push
          fi
