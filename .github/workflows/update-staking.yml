name: Update ETH Intelligence staking data
on:
  schedule:
    - cron: '25 9 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: eth-intelligence-staking-update
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Collect daily staking flows
        run: python scripts/update_staking.py
      - name: Collect active staking rate
        id: rate
        continue-on-error: true
        run: python scripts/update_staking_rate.py
      - name: Warn if rate collection fails
        if: steps.rate.outcome == 'failure'
        run: echo "::warning::CryptoKeyhole staking rate collection failed; existing data retained"
      - name: Commit changed staking data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/staking-history.json data/staking-rate.json
          if ! git diff --cached --quiet; then
            git commit -m "data: refresh ETH staking history and rate"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
