<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Macro | ETH Intelligence</title><style>body{background:#0a1220;color:#ece6d6;font:15px system-ui;margin:24px}main{max-width:1200px;margin:auto}section{background:#0f1a2b;border:1px solid #22324d;border-radius:12px;padding:20px;margin:14px 0}a{color:#c9a45c}canvas{width:100%;height:320px}nav{position:sticky;bottom:0;background:#0f1a2b;padding:16px;display:flex;gap:24px}small{color:#98a4b8}</style><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&family=Inter:wght@500;600;700&display=swap"><link rel="stylesheet" href="/theme.css"><main><h1>Macro · 거시경제</h1><p>미국 통화량 · 단기 및 장기 금리</p><div id="summary"></div><section><h2>M2 통화량 ($조)</h2><canvas id="m2"></canvas><p id="m2tip"></p><small>월별 · FRED M2SL</small></section><section><h2>M2 전년 대비 증가율 (%)</h2><canvas id="yoy"></canvas><p id="yoytip"></p></section><section><h2>단기 · 장기 금리 (%)</h2><canvas id="rates"></canvas><p id="ratestip"></p><small>최근 5년 · 3개월 / 2년 / 10년 / 30년 / 실효 연방기금금리</small></section><section><h2>10년 − 2년 금리차 (%p)</h2><canvas id="spread"></canvas><p id="spreadtip"></p><small>0 미만은 장단기 금리 역전</small></section><section><h2>달러 인덱스 DXY</h2><iframe title="DXY" src="https://s.tradingview.com/widgetembed/?symbol=TVC%3ADXY&interval=D&theme=dark&backgroundColor=%230f1a2b&style=1" width="100%" height="400" frameborder="0"></iframe></section><nav><a href="/">Overview</a><a href="/macro.html">Macro</a></nav></main><script>const names={m2:'M2',fed:'실효 연방기금금리',m3:'3개월',y2:'2년',y10:'10년',y30:'30년'},data={},plots={};function plot(id,series,zero=false){plots[id]={series,zero};let c=document.getElementById(id),w=c.clientWidth,h=320,d=devicePixelRatio;c.width=w*d;c.height=h*d;let x=c.getContext('2d');x.scale(d,d);let all=series.flatMap(s=>s.rows);if(!all.length){x.fillStyle='#98a4b8';x.fillText('데이터 미수신',20,40);return}let start=Math.min(...all.map(r=>r.t)),end=Math.max(...all.map(r=>r.t)),lo=Math.min(...all.map(r=>r.v),...(zero?[0]:[])),hi=Math.max(...all.map(r=>r.v),...(zero?[0]:[])),L=12,R=w-65,T=35,B=280,X=t=>L+(t-start)/(end-start||1)*(R-L),Y=v=>B-(v-lo)/(hi-lo||1)*(B-T);x.font='11px system-ui';for(let i=0;i<=5;i++){let v=lo+(hi-lo)*i/5,y=Y(v);x.strokeStyle='#22324d';x.beginPath();x.moveTo(L,y);x.lineTo(R,y);x.stroke();x.fillStyle='#98a4b8';x.fillText(v.toFixed(2),R+5,y+4);let t=start+(end-start)*i/5;x.textAlign=i===5?'right':i===0?'left':'center';x.fillText(new Date(t).toISOString().slice(0,7),X(t),305);x.textAlign='left'}if(zero){x.strokeStyle='#ddd';x.setLineDash([4,4]);x.beginPath();x.moveTo(L,Y(0));x.lineTo(R,Y(0));x.stroke();x.setLineDash([])}series.forEach((s,i)=>{x.strokeStyle=s.color;x.fillStyle=s.color;x.fillText(s.name,L+i*75,16);x.beginPath();s.rows.forEach((r,j)=>j?x.lineTo(X(r.t),Y(r.v)):x.moveTo(X(r.t),Y(r.v)));x.stroke()});c.onpointermove=e=>{let t=start+(e.clientX-c.getBoundingClientRect().left-L)/(R-L)*(end-start);document.getElementById(id+'tip').textContent=series.filter(s=>s.rows.length).map(s=>{let r=s.rows.reduce((a,b)=>Math.abs(a.t-t)<Math.abs(b.t-t)?a:b);return s.name+' '+new Date(r.t).toISOString().slice(0,10)+' '+r.v.toFixed(2)}).join(' · ')}}const pts=(a,f=1)=>a.map(r=>({t:Date.parse(r.date),v:r.value*f}));async function init(){await Promise.all(Object.keys(names).map(async k=>{let p=document.createElement('p');document.getElementById('summary').append(p);p.textContent=names[k]+' 조회 중';try{let r=await fetch('/api/macro?series='+k,{signal:AbortSignal.timeout(18000)}),j=await r.json();if(!r.ok)throw Error(j.error);data[k]=j.rows;let a=j.rows.at(-1);p.textContent=names[k]+' '+(k==='m2'?(a.value/1000).toFixed(2)+'조 달러':a.value+'%')+' · '+a.date}catch(e){p.textContent=names[k]+' 연결 실패: '+e.message}}));let a=data.m2||[],m=new Map(a.map(r=>[r.date.slice(0,7),r.value]));plot('m2',[{name:'M2',color:'#6fbfa8',rows:pts(a,.001)}]);plot('yoy',[{name:'YoY',color:'#c9a45c',rows:a.flatMap(r=>{let v=m.get((+r.date.slice(0,4)-1)+r.date.slice(4,7));return v?[{t:Date.parse(r.date),v:100*(r.value/v-1)}]:[]})}],true);let keys=['m3','y2','y10','y30','fed'];plot('rates',keys.map((k,i)=>({name:names[k],color:['#c9a45c','#6fbfa8','#f6b94e','#6fbfa8','#eee'][i],rows:pts(data[k]||[]).filter(r=>r.t>Date.now()-5*365.25*86400000)})));let b=new Map((data.y2||[]).map(r=>[r.date,r.value]));plot('spread',[{name:'10Y−2Y',color:'#f6b94e',rows:(data.y10||[]).filter(r=>b.has(r.date)).map(r=>({t:Date.parse(r.date),v:r.value-b.get(r.date)}))}],true)}init();window.addEventListener('resize',()=>Object.entries(plots).forEach(([id,p])=>plot(id,p.series,p.zero)));</script></html>
