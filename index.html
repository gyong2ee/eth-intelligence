<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ETH Intelligence</title><style>body{background:#090d15;color:#e6eaf4;font:15px system-ui;margin:0;padding:24px}main{max-width:1200px;margin:auto}section{background:#111927;border:1px solid #263146;border-radius:12px;padding:20px;margin:14px 0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}.value{font-size:28px;font-weight:bold}small{color:#9ba8bf}a{color:#b5a0ff}button,input{background:#192235;color:white;border:1px solid #34415b;padding:10px;border-radius:7px}canvas{width:100%;height:200px}table{width:100%;text-align:left}td,th{padding:8px;border-bottom:1px solid #263146}</style><main><h1>ETH Intelligence</h1><p>실제 데이터 연결 테스트 · <button onclick="load()">새로고침</button></p><div class="grid" id="cards"></div><section><h2>TradingView ETH/USD</h2><iframe title="TradingView" src="https://s.tradingview.com/widgetembed/?symbol=COINBASE%3AETHUSD&interval=D&theme=dark&style=1" width="100%" height="500" frameborder="0"></iframe></section><section><h2>MVRV · 일 / 주 / 월</h2><button onclick="mchart(1)">일</button> <button onclick="mchart(7)">주</button> <button onclick="mchart(30)">월</button><canvas id="mv" width="1000" height="240"></canvas><small>기준선 0.8 / 1.0 / 1.2 · 주/월은 기간 마지막 관측값</small></section><section><h2>크립토 공포지수</h2><canvas id="fg" width="1000" height="240"></canvas></section><section><h2>ETF 일별 수급</h2><p>자동 수집 미구현 · <a href="https://farside.co.uk/eth/">ETH 원본</a> · <a href="https://farside.co.uk/btc/">BTC 원본</a></p><table><tr><th>날짜</th><th>ETH 유입</th><th>ETH 유출</th><th>ETH SUM</th><th>BTC 유입</th><th>BTC 유출</th><th>BTC SUM</th></tr><tr><td colspan="7">데이터 미연결</td></tr></table></section><section><h2>My Portfolio</h2><input id="qty" type="number" placeholder="ETH 보유량"><input id="cost" type="number" placeholder="USD 평단"><button onclick="save()">저장</button><p id="pnl"></p></section><section><h2>Data Status</h2><div id="status"></div><p>미연결: ETF 자동수집, 거래소 입출금, CNN, 스테이킹, 통합 비교 차트, 장기 회귀 모델.</p></section></main><script>const names={price:'ETH / BTC 가격',fear:'크립토 공포지수',mvrv:'ETH MVRV',tvl:'DeFi TVL',funding:'펀딩비',oi:'미결제약정',vix:'VIX'};let data={},price;const fmt=x=>Number(x).toLocaleString('en-US',{maximumFractionDigits:4});function draw(id,values,lines=[]){let c=document.getElementById(id),x=c.getContext('2d');x.clearRect(0,0,c.width,c.height);if(!values.length)return;let lo=Math.min(...values,...lines),hi=Math.max(...values,...lines);let y=v=>210-(v-lo)/(hi-lo||1)*180;for(let v of lines){x.strokeStyle='#7869ad';x.beginPath();x.moveTo(0,y(v));x.lineTo(1000,y(v));x.stroke();x.fillStyle='#ddd';x.fillText(v,5,y(v)-4)}x.strokeStyle='#b397ff';x.beginPath();values.forEach((v,i)=>{let a=i*990/Math.max(1,values.length-1)+5;i?x.lineTo(a,y(v)):x.moveTo(a,y(v))});x.stroke()}function mchart(n){let a=data.mvrv?.data||[], groups={};for(let r of a){let d=r.time.slice(0,10),k=n===30?d.slice(0,7):n===7?Math.floor((Date.parse(d)/86400000+3)/7):d;if(r.CapMVRVCur!=null)groups[k]=+r.CapMVRVCur}draw('mv',Object.values(groups),[.8,1,1.2])}function save(){localStorage.qty=qty.value;localStorage.cost=cost.value;portfolio()}function portfolio(){pnl.textContent=price&&qty.value&&cost.value?'평가손익 $'+fmt((price-cost.value)*qty.value):'가격 또는 보유 정보 대기'}qty.value=localStorage.qty||'';cost.value=localStorage.cost||'';async function load(){cards.innerHTML='';status.innerHTML='';await Promise.all(Object.keys(names).map(async k=>{let card=document.createElement('section');card.innerHTML='<small>'+names[k]+'</small><p class="value">조회 중</p>';cards.append(card);let v=card.querySelector('p');let s=document.createElement('p');status.append(s);try{let r=await fetch('/api/market?source='+k,{signal:AbortSignal.timeout(15000),cache:'no-store'}),raw=await r.text(),j;try{j=JSON.parse(raw)}catch{throw Error('HTTP '+r.status+' · JSON 응답 아님: '+raw.slice(0,100))}if(!r.ok)throw Error('HTTP '+r.status+' · '+j.error);let d=j.data;data[k]=d;let val,date;if(k==='price'){price=d.ethereum.usd;val='$'+fmt(price)+' / BTC $'+fmt(d.bitcoin.usd);portfolio()}if(k==='fear'){val=d.data[0].value;date=new Date(d.data[0].timestamp*1000).toISOString();draw('fg',d.data.slice().reverse().map(a=>+a.value),[25,50,75])}if(k==='mvrv'){let a=d.data.filter(a=>a.CapMVRVCur!=null).at(-1);val=a.CapMVRVCur;date=a.time;mchart(1)}if(k==='tvl'){let a=d.at(-1);val='$'+fmt(a.tvl/1e9)+'B';date=new Date(a.date*1000).toISOString()}if(k==='funding'){val=fmt(d.lastFundingRate*100)+'%';date=new Date(d.time).toISOString()}if(k==='oi'){val=fmt(d.openInterest)+' ETH';date=new Date(d.time).toISOString()}if(k==='vix'){let a=d.trim().split('\n').filter(a=>/,[0-9.]+$/.test(a)&&!a.endsWith(',.')).at(-1).split(',');date=a[0];val=a[1]}if(val==null)throw Error('No observation');v.textContent=val;s.textContent=names[k]+': 수신 성공 · 관측 '+(date||'현재 스냅샷')+' · 조회 '+j.fetchedAt}catch(e){v.textContent='연결 실패';s.textContent=names[k]+': '+e.message+' · '+new Date().toLocaleTimeString()}}))}load()</script></html>
